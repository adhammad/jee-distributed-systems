<section class="inventory-shell py-4 px-3 px-lg-4">
  <div class="inventory-header mb-3">
    <div>
      <p class="header-eyebrow mb-1">Control Panel</p>
      <h2 class="header-title mb-0">Catalogue Produits</h2>
    </div>
    <button class="btn btn-refresh" (click)="loadProducts()">
      <i class="bi bi-arrow-repeat"></i>
      Synchroniser
    </button>
  </div>

  <div class="editor-panel mb-3">
    <div class="editor-title-row">
      <h3 class="editor-title mb-0">{{ selectedId === null ? 'Nouveau produit' : 'Modifier le produit' }}</h3>
      <button class="btn btn-reset" type="button" (click)="startCreate()">Vider</button>
    </div>

    <div class="editor-grid mt-3">
      <label class="field-group">
        <span>Nom</span>
        <input class="form-control" [(ngModel)]="formData.name" placeholder="Ex: Clavier mecanique" />
      </label>

      <label class="field-group">
        <span>Prix (DH)</span>
        <input class="form-control" type="number" min="0" step="0.01" [(ngModel)]="formData.price" />
      </label>

      <label class="field-group checkbox-field">
        <input type="checkbox" class="form-check-input" [(ngModel)]="formData.selected" />
        <span>Selectionne</span>
      </label>

      <button class="btn btn-save" type="button" (click)="saveProduct()">
        <i class="bi" [class.bi-plus-circle]="selectedId === null" [class.bi-floppy]="selectedId !== null"></i>
        {{ selectedId === null ? 'Ajouter' : 'Mettre a jour' }}
      </button>
    </div>
  </div>

  <div class="table-panel">
    <table class="table align-middle mb-0 inventory-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Designation</th>
          <th>Prix (DH)</th>
          <th>Etat</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products" [class.row-selected]="product.selected">
          <td>#{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.price | number:'1.2-2' }}</td>
          <td>
            <button class="btn btn-toggle" [class.btn-toggle-active]="product.selected" (click)="toggleSelected(product)">
              {{ product.selected ? 'Selectionne' : 'Standard' }}
            </button>
          </td>
          <td class="text-end">
            <button class="btn btn-edit me-2" (click)="startEdit(product)">
              <i class="bi bi-pencil-square"></i>
              Editer
            </button>
            <button class="btn btn-delete" (click)="onDelete(product)">
              <i class="bi bi-trash"></i>
              Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="products.length === 0" class="empty-copy mt-3">Aucun produit disponible pour le moment.</p>
</section>
