<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${product.name}">Détail produit</title>
</head>
<body>
<section class="details-page">
    <a class="back-link" th:href="@{/products}">← Retour au catalogue</a>

    <div class="detail-shell mt-3">
        <div class="detail-visual">
            <div class="detail-pattern" aria-hidden="true"></div>
            <span class="eyebrow">Fiche produit</span>
            <h1 th:text="${product.name}">Produit</h1>
            <div class="detail-reference">REF-<span th:text="${product.id}">1</span></div>
        </div>

        <div class="detail-panel">
            <div class="detail-panel-header">
                <span class="status-pill" th:classappend="${product.lowStock} ? ' status-low' : ' status-good'"
                      th:text="${product.lowStock} ? 'Stock faible' : 'Disponible'">Disponible</span>
                <span class="muted-chip">ID #<span th:text="${product.id}">1</span></span>
            </div>

            <div class="detail-metrics">
                <div class="detail-metric-card primary-metric">
                    <span>Prix de vente</span>
                    <strong><span th:text="${product.price}">0.00</span> DH</strong>
                </div>
                <div class="detail-metric-card">
                    <span>Quantité disponible</span>
                    <strong th:text="${product.quantity}">0</strong>
                </div>
                <div class="detail-metric-card">
                    <span>État opérationnel</span>
                    <strong th:text="${product.lowStock} ? 'À surveiller' : 'Stable'">Stable</strong>
                </div>
            </div>

            <div class="detail-note">
                <strong>Règle d'accès</strong>
                <p class="mb-0">
                    La consultation est publique. La modification et la suppression restent protégées par Spring Security et réservées au rôle ADMIN.
                </p>
            </div>

            <div class="detail-actions" sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-primary rounded-pill px-4" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Modifier</a>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                      onsubmit="return confirm('Supprimer ce produit ?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-danger rounded-pill px-4" type="submit">Supprimer</button>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
