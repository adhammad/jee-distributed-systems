<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${formTitle}">Produit</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card border-0 shadow-sm form-card">
                <div class="card-body p-4 p-lg-5">
                    <div class="mb-4">
                        <a class="text-decoration-none" th:href="@{/products}">← Retour à la liste</a>
                        <h1 class="h3 fw-bold mt-3" th:text="${formTitle}">Ajouter un produit</h1>
                        <p class="text-muted mb-0">Les champs sont validés côté serveur avec Jakarta Validation.</p>
                    </div>

                    <form th:object="${product}"
                          th:action="${product.id == null} ? @{/admin/products} : @{/admin/products/{id}(id=${product.id})}"
                          method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Nom du produit</label>
                            <input id="name" type="text" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:field="*{name}"
                                   placeholder="Ex. Ordinateur portable">
                            <div class="invalid-feedback" th:errors="*{name}">Erreur nom</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="price" class="form-label">Prix</label>
                                <div class="input-group input-group-lg">
                                    <input id="price" type="number" min="0" step="0.01" class="form-control"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" th:field="*{price}"
                                           placeholder="0.00">
                                    <span class="input-group-text">DH</span>
                                    <div class="invalid-feedback" th:errors="*{price}">Erreur prix</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="quantity" class="form-label">Quantité</label>
                                <input id="quantity" type="number" min="0" class="form-control form-control-lg"
                                       th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'" th:field="*{quantity}"
                                       placeholder="0">
                                <div class="invalid-feedback" th:errors="*{quantity}">Erreur quantité</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a class="btn btn-outline-secondary" th:href="@{/products}">Annuler</a>
                            <button class="btn btn-primary px-4" type="submit" th:text="${submitLabel}">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
